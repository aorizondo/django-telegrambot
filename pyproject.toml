[tool.poetry]
name = "django-telegrambot"
version = "0.1.2"  # Usa la versión actual de tu proyecto
description = "A simple app to develop Telegram bot with Django"
authors = ["django-telegrambot <francesco.scarlato@gmail.com>"]
license = "BSD"
readme = "README.rst"
homepage = "https://github.com/JungDev/django-telegrambot"
repository = "https://github.com/JungDev/django-telegrambot"
keywords = ["django", "telegram", "bot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 1.7",
    "Framework :: Django :: 1.8",
    "Framework :: Django :: 1.9",
    "Framework :: Django :: 1.10",
    "Framework :: Django :: 1.11",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
]


[tool.poetry.dependencies]
python = "^3.11"
django = ">=4.2,<5.0"
python-telegram-bot = "^22.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"  # Ejemplo de dependencia de desarrollo

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
